<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob: https:; font-src data:; connect-src https://*.supabase.co; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Not(ion)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23fff' stroke='%23111' stroke-width='5'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='40' font-weight='700' text-anchor='middle' fill='%23111'%3EN%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#ffffff; --side:#f8f8f7; --text:#37352f; --text2:rgba(55,53,47,.65); --text3:rgba(55,53,47,.45);
  --hover:rgba(55,53,47,.06); --hover2:rgba(55,53,47,.1); --border:rgba(55,53,47,.09); --border2:rgba(55,53,47,.16);
  --accent:#2383e2; --accent-bg:rgba(35,131,226,.14); --sel:rgba(35,131,226,.18); --pop:#fff; --shadow:0 0 0 1px rgba(15,15,15,.05),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);
  --code:rgba(135,131,120,.15); --codeblock:#f7f6f3; --danger:#eb5757;
  --o-default:rgba(227,226,224,.5); --o-gray:#e3e2e0; --o-brown:#eee0da; --o-orange:#fadec9; --o-yellow:#fdecc8; --o-green:#dbeddb; --o-blue:#d3e5ef; --o-purple:#e8deee; --o-pink:#f5e0e9; --o-red:#ffe2dd; --o-text:#32302c;
  --t-gray:#787774; --t-brown:#9f6b53; --t-orange:#d9730d; --t-yellow:#cb912f; --t-green:#448361; --t-blue:#337ea9; --t-purple:#9065b0; --t-pink:#c14c8a; --t-red:#d44c47;
  --b-gray:#f1f1ef; --b-brown:#f4eeee; --b-orange:#fbecdd; --b-yellow:#fbf3db; --b-green:#edf3ec; --b-blue:#e7f3f8; --b-purple:#f6f3f9; --b-pink:#faf1f5; --b-red:#fdebec;
  --font: ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif,"Segoe UI Emoji","Segoe UI Symbol";
  --serif: Lyon-Text,Georgia,ui-serif,serif; --mono: iawriter-mono,Nitti,Menlo,Courier,monospace;
  --sbw:248px;
}
html.dark{
  --bg:#191919; --side:#202020; --text:rgba(255,255,255,.86); --text2:rgba(255,255,255,.55); --text3:rgba(255,255,255,.34);
  --hover:rgba(255,255,255,.055); --hover2:rgba(255,255,255,.09); --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --accent-bg:rgba(35,131,226,.25); --sel:rgba(35,131,226,.28); --pop:#252525; --shadow:0 0 0 1px rgba(255,255,255,.06),0 3px 6px rgba(0,0,0,.4),0 9px 24px rgba(0,0,0,.5);
  --code:rgba(135,131,120,.25); --codeblock:#202020;
  --o-default:#373737; --o-gray:#5a5a5a; --o-brown:#603b2c; --o-orange:#854c1d; --o-yellow:#89632a; --o-green:#2b593f; --o-blue:#28456c; --o-purple:#492f64; --o-pink:#69314c; --o-red:#6e3630; --o-text:rgba(255,255,255,.88);
  --t-gray:#9b9b9b; --t-brown:#ba856f; --t-orange:#c77d48; --t-yellow:#ca9849; --t-green:#529e72; --t-blue:#5e87c9; --t-purple:#9d68d3; --t-pink:#d15796; --t-red:#df5452;
  --b-gray:#2f2f2f; --b-brown:#4a3228; --b-orange:#5c3b23; --b-yellow:#564328; --b-green:#243d30; --b-blue:#143a4e; --b-purple:#3c2d49; --b-pink:#4e2c3c; --b-red:#522e2a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
kbd{font-family:var(--font);font-size:11px;color:var(--text3);border:1px solid var(--border2);border-radius:4px;padding:0 4px;margin-left:4px}
a{color:inherit}
::selection{background:var(--sel)}
#app{display:flex;height:100vh;overflow:hidden}
/* ---------- Sidebar ---------- */
#sidebar{width:var(--sbw);min-width:var(--sbw);background:var(--side);display:flex;flex-direction:column;position:relative;user-select:none;transition:margin-left .2s}
#app.nosb #sidebar{margin-left:calc(-1 * var(--sbw))}
#sbresize{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}
#sbresize:hover{background:linear-gradient(to right,transparent 2px,var(--border2) 2px,var(--border2) 4px,transparent 4px)}
.ws{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 14px;cursor:default}
.ws-logo{width:22px;height:22px;border-radius:5px;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;font:700 14px Georgia,serif}
.ws-name{font-weight:600;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-sub{font-size:11px;color:var(--text3);font-weight:400;display:block}
.sb-btn{width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.sb-btn:hover{background:var(--hover2)}
.sb-scroll{flex:1;overflow:auto;padding-bottom:20px}
.sb-item{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px 0 14px;margin:0 6px;border-radius:6px;color:var(--text2);cursor:pointer;font-weight:500}
.sb-item:hover{background:var(--hover)}
.sb-item .ic{width:20px;text-align:center;font-size:14px;opacity:.85}
.sb-item kbd{margin-left:auto}
.sb-sec{display:flex;align-items:center;font-size:12px;font-weight:600;color:var(--text3);padding:14px 12px 4px 20px;cursor:default}
.sb-sec .sb-btn{margin-left:auto;opacity:0;width:20px;height:20px}
.sb-sec:hover .sb-btn{opacity:1}
.ti{display:flex;align-items:center;height:28px;margin:0 6px;border-radius:6px;padding-left:calc(6px + var(--d,0) * 14px);padding-right:6px;cursor:pointer;color:var(--text2);font-weight:500;position:relative}
.ti:hover{background:var(--hover)}
.ti.on{background:var(--hover2);color:var(--text)}
.ti.drop-in{box-shadow:inset 0 0 0 2px var(--accent)}
.ti.drop-before::before,.ti.drop-after::after{content:"";position:absolute;left:8px;right:8px;height:2px;background:var(--accent)}
.ti.drop-before::before{top:-1px}.ti.drop-after::after{bottom:-1px}
.ti .ta{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text3);flex:none}
.ti .ta:hover{background:var(--hover2)}
.ti .ta.open{transform:rotate(90deg)}
.ti .tic{width:22px;text-align:center;flex:none;font-size:14px}
.ti .tn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:2px}
.ti .tx{display:none;gap:2px}
.ti:hover .tx{display:flex}
.ti .tx b{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:400;color:var(--text3)}
.ti .tx b:hover{background:var(--hover2)}
.ti-empty{padding-left:calc(34px + var(--d,0) * 14px);height:26px;line-height:26px;color:var(--text3);font-size:13px}
.sb-foot{border-top:1px solid var(--border);padding:6px 0}
/* ---------- Main ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#topbar{height:45px;display:flex;align-items:center;padding:0 12px;gap:6px;flex:none}
#topbar .sb-btn{width:28px;height:28px}
#crumbs{display:flex;align-items:center;min-width:0;flex:1;overflow:hidden}
.crumb{padding:2px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.crumb:hover{background:var(--hover)}
.crumb-sep{color:var(--text3);margin:0 1px}
#cloudst{color:var(--text3);font-size:13px;margin-right:8px;white-space:nowrap;cursor:pointer}
#cloudst.err{color:var(--danger)}
#status{color:var(--text3);font-size:13px;margin-right:6px;white-space:nowrap}
.tb-btn{height:28px;padding:0 8px;border-radius:4px;display:flex;align-items:center;gap:4px;color:var(--text)}
.tb-btn:hover{background:var(--hover)}
#scroller{flex:1;overflow:auto;position:relative}
/* ---------- Page ---------- */
.pw{min-height:100%;padding-bottom:30vh}
.cover{height:30vh;max-height:280px;min-height:160px;background-size:cover;background-position:center 40%;position:relative}
.cover .cv-act{position:absolute;right:max(96px,calc(50% - 354px));bottom:10px;display:none;gap:0;background:var(--pop);border-radius:4px;box-shadow:var(--shadow);overflow:hidden}
.cover:hover .cv-act{display:flex}
.cv-act button{padding:4px 10px;font-size:12px;color:var(--text2)}
.cv-act button:hover{background:var(--hover)}
.pin{max-width:900px;margin:0 auto;padding:0 96px}
.pw.full .pin,.pw.isdb .pin{max-width:none}
.pw.isdb:not(.peek) .pin{padding:0 64px}
.pw.peek .pin{padding:0 48px;max-width:none}
.pw.font-serif .blocks,.pw.font-serif .ptitle{font-family:var(--serif)}
.pw.font-mono .blocks,.pw.font-mono .ptitle{font-family:var(--mono)}
.pw.small .blocks{font-size:14px}
.picon{font-size:78px;line-height:1.1;margin-top:80px;width:fit-content;border-radius:6px;cursor:pointer;padding:0 4px;margin-left:-4px;user-select:none}
.picon:hover{background:var(--hover)}
.has-cover .picon{margin-top:-42px;position:relative}
.pctl{display:flex;gap:2px;opacity:0;margin:0 0 4px -6px;height:28px;margin-top:72px;transition:opacity .15s}
.has-icon .pctl,.has-cover .pctl{margin-top:8px}
.ph:hover .pctl{opacity:1}
.pctl button{padding:4px 8px;border-radius:4px;color:var(--text3);font-size:14px}
.pctl button:hover{background:var(--hover)}
.ptitle{font-size:40px;font-weight:700;line-height:1.2;outline:none;padding:3px 2px;margin-bottom:4px;word-break:break-word;caret-color:var(--text)}
.ptitle:empty::before{content:attr(data-ph);color:var(--text3)}
.pw.peek .ptitle{font-size:32px}
.pw.peek .picon{margin-top:24px;font-size:60px}
.pw.peek .pctl{margin-top:16px}
.pw.peek.has-icon .pctl{margin-top:4px}
/* props */
.props{margin:8px 0 6px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.prop{display:flex;align-items:flex-start;min-height:34px}
.pname{width:160px;flex:none;display:flex;align-items:center;gap:6px;color:var(--text2);padding:6px 6px;border-radius:4px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden}
.pname:hover{background:var(--hover)}
.pname .pi{width:16px;text-align:center;opacity:.7;font-size:12px}
.prop .val{flex:1;min-height:32px;padding:6px 8px;border-radius:4px;cursor:pointer}
.prop .val:hover{background:var(--hover)}
.prop.add .pname{color:var(--text3)}
.val[contenteditable]{outline:none;cursor:text}
.val[contenteditable]:empty::before{content:attr(data-ph);color:var(--text3)}
.val.empty-v{color:var(--text3)}
/* ---------- Blocks ---------- */
.blocks{font-size:16px;line-height:1.5;padding:6px 0 0;position:relative}
.blk{position:relative;padding-left:calc(var(--ind,0) * 1.6em);display:flex;align-items:flex-start;border-radius:3px}
.blk .gut{position:absolute;left:calc(var(--ind,0) * 1.6em - 46px);top:3px;display:flex;opacity:0;transition:opacity .1s;user-select:none}
.blk:hover>.gut{opacity:1}
.gut span{width:22px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--text3);border-radius:4px;cursor:pointer;font-size:16px}
.gut span.drag{cursor:grab;font-size:13px;letter-spacing:-2px;width:18px}
.gut span:hover{background:var(--hover2)}
.blk.t-h1 .gut{top:22px}.blk.t-h2 .gut{top:16px}.blk.t-h3 .gut{top:10px}
.blk.selected{background:var(--sel)}
.blk.drop-before{box-shadow:0 -3px 0 0 var(--accent)}
.blk.drop-after{box-shadow:0 3px 0 0 var(--accent)}
.txt{flex:1;min-width:0;outline:none;padding:3px 2px;margin:1px 0;white-space:pre-wrap;word-break:break-word;caret-color:var(--text)}
.txt:empty:focus::before,.blk.only .txt:empty::before{content:attr(data-ph);color:var(--text3);pointer-events:none}
.t-h1 .txt:empty::before,.t-h2 .txt:empty::before,.t-h3 .txt:empty::before,.t-quote .txt:empty::before,.t-callout .txt:empty::before{content:attr(data-ph);color:var(--text3)}
.t-ul .txt:empty::before,.t-ol .txt:empty::before,.t-todo .txt:empty::before,.t-toggle .txt:empty::before{content:attr(data-ph);color:var(--text3)}
.blk.t-h1{margin-top:1.4em}.blk.t-h2{margin-top:1.1em}.blk.t-h3{margin-top:.8em}
.blk:first-child.t-h1,.blk:first-child.t-h2,.blk:first-child.t-h3{margin-top:.2em}
.t-h1 .txt{font-size:1.875em;font-weight:700;line-height:1.3}
.t-h2 .txt{font-size:1.5em;font-weight:650;line-height:1.3}
.t-h3 .txt{font-size:1.25em;font-weight:600;line-height:1.3}
.mk{flex:none;width:1.6em;display:flex;justify-content:center;align-items:flex-start;padding-top:3px;user-select:none;line-height:1.5}
.t-ul .mk{font-size:1.3em;line-height:1.1;padding-top:5px}
.t-ol .mk{width:auto;min-width:1.6em;padding-right:2px;justify-content:flex-end}
.t-todo .mk{padding-top:6px}
.cb{width:16px;height:16px;border:1.5px solid var(--text2);border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:12px;line-height:1}
.cb.on{background:var(--accent);border-color:var(--accent)}
.cb.on::after{content:"✓";font-weight:700}
.t-todo.done .txt{text-decoration:line-through;color:var(--text3)}
.tg{cursor:pointer;border-radius:4px;width:22px;height:22px;margin-top:2px;align-items:center;font-size:11px;color:var(--text2);transition:transform .12s;padding:0}
.tg:hover{background:var(--hover2)}
.tg.open{transform:rotate(90deg)}
.t-quote .txt{border-left:3px solid currentColor;padding-left:14px;margin:4px 0}
.callout{flex:1;display:flex;gap:8px;padding:14px 16px 14px 12px;border-radius:4px;background:var(--b-gray);margin:4px 0}
.callout .ci{font-size:1.2em;line-height:1.4;cursor:pointer;user-select:none}
.callout .txt{padding:0}
hr.div{flex:1;border:0;border-top:1px solid var(--border2);margin:12px 2px}
.blk.t-divider{cursor:default;min-height:26px;align-items:center}
.codew{flex:1;min-width:0;background:var(--codeblock);border-radius:4px;margin:4px 0;position:relative}
.codew .lang{position:absolute;left:12px;top:8px;font-size:12px;color:var(--text3);cursor:pointer;user-select:none}
.codew .lang:hover{color:var(--text2)}
.codew .cpy{position:absolute;right:8px;top:6px;font-size:12px;color:var(--text3);padding:2px 6px;border-radius:4px;display:none}
.codew:hover .cpy{display:block}
.codew .cpy:hover{background:var(--hover2)}
pre.txt{font-family:var(--mono);font-size:85%;line-height:1.55;padding:34px 18px 18px;margin:0;tab-size:2;white-space:pre-wrap}
.blk .fig{flex:1;margin:6px 0;text-align:center}
.blk .fig img{max-width:100%;border-radius:3px;display:block;margin:0 auto}
.blk .cap{font-size:14px;color:var(--text2);outline:none;padding:4px 2px;text-align:left}
.blk .cap:empty::before{content:"Ajouter une légende…";color:var(--text3)}
.imgph{flex:1;display:flex;align-items:center;gap:10px;background:var(--b-gray);border-radius:4px;padding:12px 14px;color:var(--text2);margin:4px 0;flex-wrap:wrap}
.imgph button{padding:4px 10px;border-radius:4px;background:var(--hover2)}
.plink{flex:1;display:flex;align-items:center;gap:6px;padding:3px 2px;border-radius:4px;cursor:pointer;margin:1px 0}
.plink:hover{background:var(--hover)}
.plink .pl-t{text-decoration:underline;text-decoration-color:var(--border2);text-underline-offset:3px;font-weight:500}
.plink.dead{color:var(--text3);font-style:italic}
.tblw{flex:1;overflow-x:auto;margin:6px 0;padding-bottom:4px}
table.stbl{border-collapse:collapse;font-size:14px;min-width:100%}
table.stbl td{border:1px solid var(--border2);padding:6px 8px;vertical-align:top;min-width:100px;outline:none;white-space:pre-wrap}
table.stbl td:focus{box-shadow:inset 0 0 0 2px var(--accent-bg)}
.tbl-act{display:flex;gap:6px;margin-top:4px;opacity:0}
.blk:hover .tbl-act{opacity:1}
.tbl-act button{font-size:12px;color:var(--text3);padding:2px 6px;border-radius:4px}
.tbl-act button:hover{background:var(--hover2)}
/* inline */
.txt code,.val code,td code{font-family:var(--mono);font-size:85%;background:var(--code);color:#eb5757;padding:.2em .4em;border-radius:4px}
.txt a,td a{color:inherit;text-decoration:underline;text-decoration-color:var(--text3);text-underline-offset:2px;cursor:pointer}
.txt a[data-page]{text-decoration:none;font-weight:500}
.txt a[data-page]::before{content:"↗ ";color:var(--text3);font-weight:400}
.c-gray{color:var(--t-gray)}.c-brown{color:var(--t-brown)}.c-orange{color:var(--t-orange)}.c-yellow{color:var(--t-yellow)}.c-green{color:var(--t-green)}.c-blue{color:var(--t-blue)}.c-purple{color:var(--t-purple)}.c-pink{color:var(--t-pink)}.c-red{color:var(--t-red)}
.bg-gray{background:var(--b-gray)}.bg-brown{background:var(--b-brown)}.bg-orange{background:var(--b-orange)}.bg-yellow{background:var(--b-yellow)}.bg-green{background:var(--b-green)}.bg-blue{background:var(--b-blue)}.bg-purple{background:var(--b-purple)}.bg-pink{background:var(--b-pink)}.bg-red{background:var(--b-red)}
.blk.bc-gray .txt,.blk.bc-gray .callout{color:var(--t-gray)}.blk.bc-brown .txt{color:var(--t-brown)}.blk.bc-orange .txt{color:var(--t-orange)}.blk.bc-yellow .txt{color:var(--t-yellow)}.blk.bc-green .txt{color:var(--t-green)}.blk.bc-blue .txt{color:var(--t-blue)}.blk.bc-purple .txt{color:var(--t-purple)}.blk.bc-pink .txt{color:var(--t-pink)}.blk.bc-red .txt{color:var(--t-red)}
.blk.bb-gray .txt,.blk.bb-gray .callout{background:var(--b-gray)}.blk.bb-brown .txt,.blk.bb-brown .callout{background:var(--b-brown)}.blk.bb-orange .txt,.blk.bb-orange .callout{background:var(--b-orange)}.blk.bb-yellow .txt,.blk.bb-yellow .callout{background:var(--b-yellow)}.blk.bb-green .txt,.blk.bb-green .callout{background:var(--b-green)}.blk.bb-blue .txt,.blk.bb-blue .callout{background:var(--b-blue)}.blk.bb-purple .txt,.blk.bb-purple .callout{background:var(--b-purple)}.blk.bb-pink .txt,.blk.bb-pink .callout{background:var(--b-pink)}.blk.bb-red .txt,.blk.bb-red .callout{background:var(--b-red)}
.blk.bb-gray .callout .txt,.blk.bb-brown .callout .txt,.blk.bb-orange .callout .txt,.blk.bb-yellow .callout .txt,.blk.bb-green .callout .txt,.blk.bb-blue .callout .txt,.blk.bb-purple .callout .txt,.blk.bb-pink .callout .txt,.blk.bb-red .callout .txt{background:none}
.empty-hint{color:var(--text3);padding:3px 2px;cursor:text}
/* ---------- Chips ---------- */
.chip{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:3px;font-size:13px;line-height:1;white-space:nowrap;background:var(--o-default);color:var(--o-text);margin:1px 4px 1px 0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.st{border-radius:10px;padding:0 8px 0 6px}
.chip.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.55;margin-right:5px;flex:none}
.o-gray{background:var(--o-gray)}.o-brown{background:var(--o-brown)}.o-orange{background:var(--o-orange)}.o-yellow{background:var(--o-yellow)}.o-green{background:var(--o-green)}.o-blue{background:var(--o-blue)}.o-purple{background:var(--o-purple)}.o-pink{background:var(--o-pink)}.o-red{background:var(--o-red)}
.chip .x{margin-left:4px;opacity:.5;cursor:pointer}
.chip .x:hover{opacity:1}
/* ---------- Database ---------- */
.dbw{margin-top:6px}
.dbbar{display:flex;align-items:center;border-bottom:1px solid var(--border);margin-bottom:4px;gap:2px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:3}
.vtabs{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto}
.vtab{height:34px;display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--text2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}

<script>
'use strict';
/* =====================================================================
   Not(ion) — clone local et privé de l'interface Notion
   Aucune requête réseau (CSP connect-src 'none'). Données dans IndexedDB.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const isMac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
const MOD=isMac?'⌘':'Ctrl';
const uid=()=>(crypto.randomUUID?crypto.randomUUID().replace(/-/g,''):(Date.now().toString(16)+Math.random().toString(16).slice(2)).padEnd(32,'0').slice(0,32));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='style'&&typeof v==='object'){for(const[sk,sv]of Object.entries(v)){if(sk.startsWith('--'))e.style.setProperty(sk,sv);else e.style[sk]=sv;}}else e.setAttribute(k,v===true?'':v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c instanceof Node?c:document.createTextNode(c));}return e;};
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms);};};
const COLORS=['default','gray','brown','orange','yellow','green','blue','purple','pink','red'];
const COLOR_FR={default:'Par défaut',gray:'Gris',brown:'Marron',orange:'Orange',yellow:'Jaune',green:'Vert',blue:'Bleu',purple:'Violet',pink:'Rose',red:'Rouge'};
const isMod=e=>{ if(!isMac && e.ctrlKey && e.altKey) return false; return isMac?e.metaKey:e.ctrlKey; };

/* ---------------------------- Toast ---------------------------- */
let toastT; function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms);}

/* ---------------------------- Stockage ---------------------------- */
let S=null, KEY=null, SALT=null;
const IDB={db:null,
  open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const r=indexedDB.open('notion-local',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>rej(r.error);});},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});},
  async del(k){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
};
async function deriveKey(pw,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encryptState(){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify(S)));return{enc:1,salt:SALT,iv,ct:new Uint8Array(ct),at:Date.now()};}
async function decryptState(v,pw){const k=await deriveKey(pw,v.salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:v.iv},k,v.ct);return{k,data:JSON.parse(new TextDecoder().decode(pt))};}
let saveT=null, dirty=false, STORE_OK={idb:false,ls:false};
const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const LS={get(){try{const r=localStorage.getItem('notion-local-state');if(!r)return null;const v=JSON.parse(r);if(v.enc){v.salt=b64d(v.salt);v.iv=b64d(v.iv);v.ct=b64d(v.ct);}return v;}catch(e){return null;}},
  set(v){try{const o=v.enc?{enc:1,salt:b64e(v.salt),iv:b64e(v.iv),ct:b64e(v.ct),at:v.at}:v;localStorage.setItem('notion-local-state',JSON.stringify(o));return true;}catch(e){return false;}}};
/* ---- Fichier de données sur le disque (File System Access API) ---- */
let FH=null, FILE_ERR=false; const FS_OK='showSaveFilePicker' in window&&'showOpenFilePicker' in window;
const FTYPES=[{description:'Données Not(ion)',accept:{'application/json':['.json']}}];
function serial(v){return v.enc?{format:'notion-local-file',version:1,at:v.at,enc:1,salt:b64e(v.salt),iv:b64e(v.iv),ct:b64e(v.ct)}:{format:'notion-local-file',version:1,at:v.at,enc:0,data:v.data};}
function deserial(o){if(!o)return null;if(o.enc)return{enc:1,at:o.at,salt:b64d(o.salt),iv:b64d(o.iv),ct:b64d(o.ct)};if(o.data&&o.data.pages)return{enc:0,at:o.at,data:o.data};if(o.format==='notion-local'&&Array.isArray(o.pages))return{legacy:true,obj:o};return null;}
async function fileRead(h){const f=await h.getFile();const t=await f.text();if(!t.trim())return null;return deserial(JSON.parse(t));}
let fileWriting=null;
async function fileWrite(v){if(!FH)return false;const job=(async()=>{const w=await FH.createWritable();await w.write(JSON.stringify(serial(v)));await w.close();})();fileWriting=job;await job;return true;}
async function linkFile(h,{write=true}={}){FH=h;FILE_ERR=false;try{await IDB.set('fh',h);}catch(e){}if(write)await saveNow();updateFileStatus();}
async function pickNewFile(){const h=await showSaveFilePicker({suggestedName:'notion-donnees.json',types:FTYPES,id:'notion-data',startIn:'documents'});await linkFile(h);toast('📁 Les données sont maintenant enregistrées dans '+h.name,4000);}
async function pickExistingFile(){const[h]=await showOpenFilePicker({types:FTYPES,id:'notion-data',startIn:'documents'});return h;}
function updateFileStatus(){const s=$('#status');if(!s)return;s.title=FH?'Fichier de données : '+FH.name:'Données dans le navigateur uniquement';}
async function reconnectFile(h){const perm=await h.requestPermission({mode:'readwrite'});if(perm!=='granted')return toast('Accès refusé au fichier');const v=await fileRead(h);FH=h;$('#sbanner')&&$('#sbanner').remove();if(v&&(v.at||0)>(lastLoadedAt||0)){if(v.enc&&!KEY){location.reload();return;}if(!v.enc){S=v.data;migrate();route();}}else await saveNow();updateFileStatus();toast('📁 Fichier reconnecté : '+h.name);}
let lastLoadedAt=0;
/* ---- Stockage en ligne : Supabase (REST, sans bibliothèque) ----
   Pour ne plus avoir à ressaisir la configuration après un vidage du cache,

/* ---------------------------- Raccourcis globaux ---------------------------- */
document.addEventListener('keydown',e=>{const mod=isMod(e);const k=e.key.toLowerCase();
  if(mod&&(k==='p'||(k==='k'&&!(curTxt()&&!getSelection().isCollapsed)))&&!e.shiftKey){e.preventDefault();closePops();openSearch();return;}
if((e.ctrlKey||e.metaKey)&&(e.key==='\\'||e.code==='Backslash')){e.preventDefault();toggleSidebar();return;}  
if(mod&&e.shiftKey&&k==='l'){e.preventDefault();const dark=document.documentElement.classList.contains('dark');S.settings.theme=dark?'light':'dark';applyTheme();save();return;}
  if((e.ctrlKey||e.metaKey)&&e.altKey&&e.code==='KeyN'){e.preventDefault();const p=newPage();save();go(p.id);return;}
  if(mod&&(e.key==='/'||e.code==='Slash')&&!e.shiftKey){e.preventDefault();openHelp();return;}
  if(mod&&e.key==='['&&!curTxt()){e.preventDefault();history.back();return;}
  if(mod&&e.key===']'&&!curTxt()){e.preventDefault();history.forward();return;}
  if(mod&&k==='s'&&!e.shiftKey){e.preventDefault();saveNow();toast('Enregistré');return;}
  if(mod&&k==='z'){const ed=ACTIVE_ED&&ACTIVE_ED.el.isConnected?ACTIVE_ED:null;const ae=document.activeElement;if(ed&&(!ae||ed.el.contains(ae)||ae===document.body)){e.preventDefault();ed.undo(e.shiftKey);return;}}
  if(mod&&k==='y'&&!isMac){const ed=ACTIVE_ED;if(ed&&ed.el.isConnected){e.preventDefault();ed.undo(true);return;}}
  if(e.key==='Escape'){if(POPS.length){e.preventDefault();POPS[POPS.length-1].close();return;}if(MODALS.length){MODALS[MODALS.length-1].close();return;}if(PEEK&&!(document.activeElement&&document.activeElement.isContentEditable)){closePeek();return;}}
  // sélection de blocs
  const ed=ACTIVE_ED;if(ed&&ed.sel.size&&ed.el.isConnected&&!(document.activeElement&&document.activeElement.isContentEditable)&&!POPS.length&&!MODALS.length){const ids=ed.visibleIds().filter(id=>ed.sel.has(id));
    if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();ed.removeBlocks(ids);return;}
    if(e.key==='Escape'){ed.clearSel();return;}
    if(e.key==='Enter'){e.preventDefault();const id=ids[0];ed.clearSel();if(!ed.focusBlock(id,'end'))ed.select([id]);return;}
    if(mod&&k==='d'){e.preventDefault();ed.duplicate(ids);return;}
    if(mod&&k==='a'){e.preventDefault();ed.select(ed.visibleIds());return;}
    if(mod&&(k==='c'||k==='x')){e.preventDefault();const md=blocksToMd(ed.blocks.filter(b=>ids.includes(b.id)));(navigator.clipboard?navigator.clipboard.writeText(md):Promise.reject()).then(()=>toast(k==='x'?'Coupé':'Copié')).catch(()=>{});if(k==='x')ed.removeBlocks(ids);return;}
    if(mod&&e.shiftKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();ed.moveBlocks(ids,e.key==='ArrowUp'?-1:1);return;}
    if(e.key==='Tab'){e.preventDefault();ed.indent(ids,e.shiftKey?-1:1);ed.select(ids);return;}
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();const vis=ed.visibleIds();const up=e.key==='ArrowUp';let cur=up?vis.indexOf(ids[0]):vis.indexOf(ids[ids.length-1]);if(e.shiftKey){const anchorI=vis.indexOf(ed.anchor);const fi=vis.indexOf(ids[0]),li=vis.indexOf(ids[ids.length-1]);let a=fi,b=li;if(up){if(li>anchorI)b--;else a=Math.max(0,a-1);}else{if(fi<anchorI)a++;else b=Math.min(vis.length-1,b+1);}ed.select(vis.slice(a,b+1),ed.anchor);}else{const n=Math.max(0,Math.min(vis.length-1,cur+(up?-1:1)));ed.select([vis[n]]);}return;}
    if(mod&&k==='z'){e.preventDefault();ed.undo(e.shiftKey);return;}
    if(e.key.length===1&&!mod){const id=ids[ids.length-1];const b=ed.blk(id);if(b&&TEXTY.has(b.type)){ed.clearSel();ed.focusBlock(id,'end');}}}
});
document.addEventListener('mousedown',e=>{const ed=ACTIVE_ED;if(ed&&ed.sel.size&&!e.target.closest('.gut,.pop'))ed.clearSel();},true);
// clic dans la zone vide sous les blocs → focus dernier bloc / nouveau bloc
document.addEventListener('click',e=>{const pin=e.target.closest('.pin');if(!pin||e.target!==pin&&!e.target.classList.contains('pw'))return;const be=pin.querySelector('.blocks');if(!be)return;const r=be.getBoundingClientRect();if(e.clientY<r.bottom)return;const w=pin.closest('.pw');const ed=w&&w._editor;if(!ed)return;const last=ed.blocks[ed.blocks.length-1];if(last&&last.type==='p'&&!last.html)ed.focusBlock(last.id,0);else{const nb=newBlock('p');ed.blocks.push(nb);ed.changed();ed.render();ed.focusBlock(nb.id,0);}});

/* ---------------------------- Démarrage ---------------------------- */
function migrate(){S.settings=S.settings||{};S.settings.expanded=S.settings.expanded||[];S.settings.recent=S.settings.recent||[];if(S.settings.sb===undefined)S.settings.sb=true;Object.values(S.pages).forEach(p=>{p.blocks=p.blocks||[];p.props=p.props||{};});}
function start(){setTimeout(()=>{if(!CL.sess)return;if(!KEY){cloudUI('nokey');storageBanner('Pour activer le stockage en ligne, définis un mot de passe de chiffrement : Paramètres → Sécurité. Tes données ne partent sur Supabase que chiffrées.');}else if(CL.needPush)saveNow();},600);migrate();applyTheme();$('#app').classList.toggle('nosb',!S.settings.sb);$('#sbopen').style.display=S.settings.sb?'none':'flex';if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});route();setStatus('Enregistré');}
async function boot(){await storageCheck();let v=null;try{v=await IDB.get('state');}catch(e){console.error(e);}const l=LS.get();if(l&&(!v||(l.at||0)>(v.at||0)))v=l;
  let fh=null;try{fh=await IDB.get('fh');}catch(e){}
  if(fh&&FS_OK){try{const perm=await fh.queryPermission({mode:'readwrite'});if(perm==='granted'){const fv=await fileRead(fh);FH=fh;if(fv&&(!v||(fv.at||0)>=(v.at||0)))v=fv;}else{setTimeout(()=>fileBanner(fh),300);}}catch(e){console.warn(e);}}
  CL.cfg=CL.loadCfg();if(CL.cfg){CL.sess=CL.loadSess();if(!CL.sess){showCloudLogin(v);return;}v=await cloudMerge(v);openState(v);cloudUI();return;}
  if(!v&&FS_OK&&!fh){showWelcomeFile();return;}
  openState(v);}
function openState(v){if(v&&v.legacy){FH=null;IDB.del('fh').catch(()=>{});seed();importJson(v.obj);start();saveNow();setTimeout(()=>toast('Données importées. Choisis maintenant où les enregistrer : Paramètres → Fichier de données.',7000),400);return;}lastLoadedAt=(v&&v.at)||0;if(v&&v.enc){showLock(v);return;}S=v&&v.data?v.data:seed();if(!v||v.legacy)saveNow();start();updateFileStatus();}
function showWelcomeFile(){const box=h('div',{id:'lock'},h('div',{class:'lk',style:{width:'380px'}},h('div',{class:'ws-logo',text:'N'}),h('div',{style:{fontWeight:600,fontSize:'18px',marginBottom:'6px'},text:'Bienvenue dans Not(ion)'}),h('div',{style:{color:'var(--text2)',fontSize:'14px',marginBottom:'18px',lineHeight:'1.5'},text:'Tes pages sont enregistrées dans un fichier sur ton ordinateur, pour survivre au vidage du cache du navigateur.'}),
  h('button',{text:'📂 Ouvrir mon fichier de données',onclick:async()=>{try{const fh=await pickExistingFile();const fv=await fileRead(fh);if(!fv||!fv.legacy){FH=fh;try{await IDB.set('fh',fh);}catch(e){}}box.remove();openState(fv);}catch(e){if(e.name!=='AbortError')toast('Fichier illisible : '+e.message,5000);}}}),
  h('button',{text:'✨ Créer un nouveau fichier',style:{marginTop:'8px',background:'var(--hover2)',color:'var(--text)'},onclick:async()=>{try{const fh=await showSaveFilePicker({suggestedName:'notion-donnees.json',types:FTYPES,id:'notion-data',startIn:'documents'});box.remove();FH=fh;try{await IDB.set('fh',fh);}catch(e){}openState(null);}catch(e){if(e.name!=='AbortError')toast(e.message);}}}),
  h('button',{text:'Continuer sans fichier',style:{marginTop:'8px',background:'none',color:'var(--text3)'},onclick:()=>{box.remove();openState(null);}})));document.body.append(box);applyThemeRaw();}
boot();
</script>
